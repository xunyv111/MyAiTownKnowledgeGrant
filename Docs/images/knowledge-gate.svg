<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge gate architecture</title>
  <desc id="desc">Player grants and live context tags build a dialogue knowledge view, which feeds a model. Strict JSON claims pass a fact guard before SafeText reaches outputs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="620" fill="#0b1220"/>
  <text x="60" y="54" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="30" font-weight="700">Two gates, one dialogue turn</text>
  <text x="60" y="86" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">Input gate: player grants intersect live context. Output gate: strict model JSON must cite allowed facts.</text>

  <!-- Inputs -->
  <g filter="url(#shadow)">
    <rect x="50" y="140" width="240" height="120" rx="14" fill="#12213a" stroke="#38bdf8" stroke-width="2"/>
    <text x="70" y="174" fill="#7dd3fc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">PLAYER STATE · AUTHORITY</text>
    <text x="70" y="206" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700">KnowledgeGrant</text>
    <text x="70" y="234" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12">packs · grants · revision · epoch</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="50" y="300" width="240" height="120" rx="14" fill="#10251f" stroke="#34d399" stroke-width="2"/>
    <text x="70" y="334" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">LIVE CONTEXT</text>
    <text x="70" y="366" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700">ContextCollector</text>
    <text x="70" y="394" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12">scene · interaction · mention</text>
  </g>

  <!-- Build view -->
  <g filter="url(#shadow)">
    <rect x="350" y="210" width="240" height="150" rx="14" fill="#172033" stroke="#a78bfa" stroke-width="2"/>
    <text x="370" y="244" fill="#c4b5fd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">INPUT GATE</text>
    <text x="370" y="276" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700">Build Knowledge View</text>
    <text x="370" y="304" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">grants ∩ activation tags</text>
    <text x="370" y="328" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">docs + facts + fingerprint</text>
  </g>

  <!-- Model -->
  <g filter="url(#shadow)">
    <rect x="650" y="210" width="200" height="150" rx="14" fill="#1a2238" stroke="#facc15" stroke-width="2"/>
    <text x="670" y="244" fill="#fde047" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">UNTRUSTED</text>
    <text x="670" y="276" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700">Model JSON</text>
    <text x="670" y="304" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">claims + evidenceFactIds</text>
    <text x="670" y="328" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">strict schema · bounded</text>
  </g>

  <!-- Guard -->
  <g filter="url(#shadow)">
    <rect x="900" y="210" width="250" height="150" rx="14" fill="#2a111a" stroke="#fb7185" stroke-width="2"/>
    <text x="920" y="244" fill="#fda4af" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">OUTPUT GATE</text>
    <text x="920" y="276" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700">Fact Guard</text>
    <text x="920" y="304" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">FactId · entities · numbers</text>
    <text x="920" y="328" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">negative · lexicon · outcome</text>
  </g>

  <!-- Input arrows -->
  <line x1="292" y1="200" x2="340" y2="250" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="292" y1="360" x2="340" y2="320" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="592" y1="285" x2="640" y2="285" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="852" y1="285" x2="890" y2="285" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- SafeText -->
  <g filter="url(#shadow)">
    <rect x="900" y="410" width="250" height="96" rx="14" fill="#10251f" stroke="#34d399" stroke-width="2"/>
    <text x="920" y="442" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">ONLY CONSUMABLE OUTPUT</text>
    <text x="920" y="474" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700">SafeText</text>
    <text x="920" y="496" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">subtitles · voice · behavior · logs</text>
  </g>
  <line x1="1025" y1="362" x2="1025" y2="400" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Side systems -->
  <g>
    <rect x="350" y="430" width="260" height="110" rx="14" fill="#111827" stroke="#475569" stroke-dasharray="6 5"/>
    <text x="370" y="462" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">REACTION MEMORY</text>
    <text x="370" y="490" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">NpcKnowledgeReceiver</text>
    <text x="370" y="516" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">audience × receipt · NOT an authorization gate</text>
  </g>
  <g>
    <rect x="650" y="430" width="200" height="110" rx="14" fill="#111827" stroke="#475569" stroke-dasharray="6 5"/>
    <text x="670" y="462" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">PERSISTENCE</text>
    <text x="670" y="490" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">Schema v3 snapshots</text>
    <text x="670" y="516" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">registry · closure · tags · epoch</text>
  </g>

  <text x="60" y="586" fill="#64748b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">The model is untrusted. Only the guard's SafeText may reach subtitles, voice, behavior trees, or logs.</text>
</svg>
